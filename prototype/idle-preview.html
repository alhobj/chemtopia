<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chemtopia · Idle animations</title><link rel="stylesheet" href="adventure.css"><style>
main{max-width:1150px;margin:auto;padding:24px}.idle-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;padding:12px;background:#f9f6eb;z-index:2;border:1px solid #bccbbe;border-radius:6px}.idle-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.idle-card{background:#f9f6eb;border:1px solid #bccbbe;border-radius:8px;padding:12px;text-align:center}.idle-card svg{width:100%;height:160px;image-rendering:pixelated}.idle-card h3{font-size:16px;margin:6px}.idle-card p{font-size:12px;margin:0;min-height:36px}section{margin:30px 0}h2{font-size:24px}select{padding:10px;background:#fffdf5;color:#274851;border:1px solid #bccbbe;border-radius:5px}@media(max-width:850px){.idle-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:480px){main{padding:12px}.idle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.idle-tools{position:static}.idle-card svg{height:150px}}
</style></head>
<body><main><a href="adventure.html">← Town</a><h1>Little moments in Chemtopia</h1><p>Breathing and blinking in every visible direction, with occasional personality gestures when facing south.</p><div class="idle-tools"><label for="idle-direction">Facing</label><select id="idle-direction"><option value="south">South</option><option value="east">East</option><option value="north">North</option><option value="west">West</option></select><button id="show-gestures">Show gestures</button><button id="natural-idles">Natural timing</button><button id="pause-idles">Pause animations</button><span id="idle-status" role="status"></span></div><div id="idle-groups"></div></main><script type="module" src="idle-preview.js"></script></body>
</html>
